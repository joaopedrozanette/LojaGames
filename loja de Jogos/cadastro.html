<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botão para abrir a sidebar -->
  <button id="openSidebar">&#9776;</button>

  <!-- Sidebar oculta -->
  <div id="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeSidebar()">&times;</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="cadastro.html">Cadastro de Produtos</a>
    <a href="listagem.html">Listagem de Produtos</a>
    <a href="perfil.html">Perfil de Usuário</a>
    <a href="login.html">Login</a>
  </div>

  <!-- Formulario de Cadastro de Produtos -->
  <div class="container mt-5">
    <h2>Cadastro de Produtos</h2>
    <form>
      <div class="mb-3">
        <label for="productName" class="form-label">Nome do Produto</label>
        <input type="text" class="form-control" id="productName" required>
      </div>
      <div class="mb-3">
        <label for="productDescription" class="form-label">Descrição do Produto</label>
        <textarea class="form-control" id="productDescription" rows="3" required></textarea>
      </div>
      <div class="mb-3">
        <label for="productPrice" class="form-label">Preço</label>
        <input type="number" class="form-control" id="productPrice" step="0.01" required>
      </div>
      <div class="mb-3">
        <label for="productQuantity" class="form-label">Quantidade</label>
        <input type="number" class="form-control" id="productQuantity" required>
      </div>

      <!-- Campo para fazer upload de imagem -->
      <div class="mb-3">
        <label for="productImage" class="form-label">Imagem do Produto</label>
        <input type="file" class="form-control" id="productImage" accept="image/*">
      </div>

      <button type="submit" class="btn btn-primary">Cadastrar Produto</button>
    </form>
  </div>

  <!-- Script da sidebar -->
  <script src="sidebar.js"></script>


</body>
</html>
