<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Home</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Estilos da sidebar */
    #sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 1;
      top: 0;
      left: 0;
      background-color: #343a40;
      overflow-x: hidden;
      transition: 0.5s;
      padding-top: 60px;
    }

    #sidebar a {
      padding: 8px 8px 8px 32px;
      text-decoration: none;
      font-size: 25px;
      color: #f8f9fa;
      display: block;
      transition: 0.3s;
    }

    #sidebar a:hover {
      color: #f1f1f1;
    }

    #sidebar .closebtn {
      position: absolute;
      top: 0;
      right: 25px;
      font-size: 36px;
      margin-left: 50px;
    }

    #openSidebar {
      font-size: 30px;
      cursor: pointer;
      position: fixed;
      top: 10px;
      left: 10px;
      color: #343a40;
      background-color: transparent;
      border: none;
    }

    
    .main-content {
      margin-left: 60px;
      padding: 16px;
    }
  </style>
</head>
<body>

  <!-- tres linhas da sidebar -->
  <button id="openSidebar">&#9776;</button>

  <!-- Sidebar oculta -->
  <div id="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeSidebar()">&times;</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="cadastro.html">Cadastro de Produtos</a>
    <a href="listagem.html">Listagem de Produtos</a>
    <a href="perfil.html">Perfil de Usuário</a>
    <a href="login.html">Login</a>
  </div>

  
  <div class="main-content">
    <h1>Bem-vindo à área administrativa!</h1>
    <p>Use o menu de navegação para acessar as funcionalidades do site.</p>
  </div>

  <!-- Script da sidebar -->
  <script src="sidebar.js"></script>


</body>
</html>
