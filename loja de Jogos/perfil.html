<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Usuário</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botão para abrir a sidebar -->
  <button id="openSidebar">&#9776;</button>

  <!-- Sidebar oculta -->
  <div id="sidebar">
    <a href="javascript:void(0)" class="closebtn" onclick="closeSidebar()">&times;</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="cadastro.html">Cadastro de Produtos</a>
    <a href="listagem.html">Listagem de Produtos</a>
    <a href="perfil.html">Perfil de Usuário</a>
    <a href="login.html">Login</a>
  </div>

  <!-- Perfil de Usuário -->
  <div class="container mt-5 text-center">
    <h2>Perfil de Usuário</h2>
    <div class="mb-3">
      <img id="profileImage" src="sidao.jpg" class="rounded-circle" width="150" height="150" alt="Foto de Perfil">
    </div>
    <div class="mb-3">
      <input type="file" id="uploadImage" class="form-control" style="display: none;" accept="image/*">
      <button type="button" class="btn btn-secondary" onclick="document.getElementById('uploadImage').click();">Alterar Foto</button>
    </div>
    <form>
      <div class="mb-3">
        <label for="userName" class="form-label">Nome do Usuário</label>
        <input type="text" class="form-control" id="userName" value="Sidão Do game" readonly>
      </div>
      <div class="mb-3">
        <label for="userEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="userEmail" value="sidao.do.game@gmail.com" readonly>
      </div>
      <button type="button" class="btn btn-primary">Editar Perfil</button>
    </form>
  </div>

  <!-- Script da sidebar -->
  <script>
    function openSidebar() {
      document.getElementById("sidebar").style.width = "250px";
    }

    function closeSidebar() {
      document.getElementById("sidebar").style.width = "0";
    }

    document.getElementById("openSidebar").addEventListener("click", openSidebar);

    document.getElementById("uploadImage").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById("profileImage").src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  </script>
</body>
</html>
